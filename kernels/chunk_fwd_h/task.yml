description: |
  Gated DeltaNet inter-chunk state recurrence (forward, h) for AMD MI300X (CDNA3).

  The sequence of length T is partitioned into non-overlapping chunks of BT = 64
  timesteps. For each chunk we update a per-(batch, head) state matrix
  h[K, V] via:

      g_chunk[t]      = cumulative gate within the chunk (precomputed in g)
      diff_t          = g_chunk[end] - g_chunk[t]
      v_gated[t]      = v[t] * exp(diff_t)            (elementwise on V)
      h_new           = h_old * exp(g_chunk[end])
                        + k_chunk.T @ v_gated_chunk   ([K, BT] @ [BT, V])

  The output h has shape [B, NT, H, K, V] where NT = T // BT.

  Per-chunk matmuls are mapped to MFMA matrix-core instructions via tl.dot,
  exponentials use exp2 (single-instruction on MI300X), and gate scalars are
  folded into the smaller of the two operands. The kernel is persistent: one
  program per (batch, head) pair iterates the chunk loop, eliminating
  per-chunk launch overhead.

shapes:
  tests:
    - {B: 1, T: 64,  H: 1, K: 64, V: 64,  seed: 4242}
    - {B: 2, T: 128, H: 4, K: 64, V: 64,  seed: 5236}
    - {B: 1, T: 256, H: 4, K: 64, V: 128, seed: 1001}
  benchmarks:
    - {B: 1, T: 64,   H: 1, K: 64, V: 64, seed: 31232}
    - {B: 2, T: 512,  H: 3, K: 64, V: 64, seed: 4052}
    - {B: 2, T: 1024, H: 3, K: 64, V: 64, seed: 2146}

tolerances:
  rtol: 1.0e-2
  atol: 1.0e-2
